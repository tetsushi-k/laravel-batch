# =============================================================
# Nginx 設定ファイル
# PHPリクエストをPHP-FPM（appコンテナ）に転送する設定
# =============================================================

server {
    # ポート80でHTTPリクエストを受け付ける
    listen 80;
    server_name localhost;

    # LaravelのドキュメントルートはpublicディレクトリにすることでE
    # アプリケーションの内部ファイルへの直接アクセスを防ぐ（セキュリティ上重要）
    root /var/www/public;
    index index.php index.html;

    # URLルーティング設定
    # 存在するファイル・ディレクトリは直接返し、それ以外はindex.phpに渡す
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHPファイルのリクエスト処理
    # PHP-FPM（appコンテナ）にFastCGIで転送する
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .htaccessなどの隠しファイルへのアクセスを禁止する
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
