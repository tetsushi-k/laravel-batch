# =============================================================
# Docker Compose 設定ファイル
# 構成: PHP 8.2（Laravel実行環境）+ MySQL 8.0（DB）+ Nginx（Webサーバー）
#       + Queue Worker（バックグラウンドジョブ処理）
# =============================================================

services:

  # -----------------------------------------------------------
  # PHP-FPM サービス
  # Laravel アプリケーションを実行するコンテナ
  # PHP 8.2 を採用（Laravel 11.x の推奨バージョン）
  # -----------------------------------------------------------
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_batch_app
    volumes:
      - ./src:/var/www
    networks:
      - laravel_batch_network
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------------------
  # Nginx サービス
  # 外部からのHTTPリクエストを受け取り、PHP-FPMに転送する
  # ポート80で待ち受け、ブラウザから http://localhost でアクセス可能
  # -----------------------------------------------------------
  web:
    image: nginx:1.25-alpine
    container_name: laravel_batch_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_batch_network
    depends_on:
      - app

  # -----------------------------------------------------------
  # MySQL サービス
  # Laravel のデータ永続化に使用
  # MySQL 8.0 を採用（認証方式が新しく、セキュリティが向上）
  # -----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: laravel_batch_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: laravel_batch
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_batch_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Queue Worker サービス
  # database ドライバでキューに積まれたジョブを処理する
  # SendMonthlyReminderJob（リマインドメール送信）を非同期処理
  # -----------------------------------------------------------
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_batch_queue
    volumes:
      - ./src:/var/www
    networks:
      - laravel_batch_network
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    restart: unless-stopped

networks:
  laravel_batch_network:
    driver: bridge

volumes:
  db_data:
    driver: local
